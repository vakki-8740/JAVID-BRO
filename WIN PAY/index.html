<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinPay - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-rectangle">
            <img src="IMAGE/photo_2026-07-19_22-33-25.jpg" alt="Logo">
        </div>
        <div class="welcome-text">
            <h1>Hello,<br>Welcome to WinPay</h1>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <div class="input-icon">
                    <!-- Phone Icon SVG -->
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                </div>
                <input type="tel" id="phoneInput" placeholder="Please enter your phone number" maxlength="10">
            </div>
            <div class="char-counter" id="charCounter">0/10</div>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <div class="input-icon">
                    <!-- Lock Icon SVG -->
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <input type="password" id="passwordInput" placeholder="Enter your password">
                <div class="toggle-icon" id="togglePassword">
                    <!-- Eye Off Icon SVG (hidden password) -->
                    <svg id="eyeOffIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <!-- Eye On Icon SVG (visible password) -->
                    <svg id="eyeOnIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
            </div>
        </div>

        <button class="login-btn" id="loginBtn">Login</button>

        <div class="forgot-password">
            <a href="#">forget the password?</a>
        </div>

    </div>

    <div class="otp-popup" id="otpPopup">
        <div class="otp-popup-content">
            <h2>OTP Verification</h2>
            <p>Enter the 6-digit code sent to your phone</p>
            <div class="otp-inputs" id="otpInputs">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            </div>
            <button class="otp-verify-btn" id="otpVerifyBtn">Verify OTP</button>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
