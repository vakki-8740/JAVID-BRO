<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WynnPay - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== LOGO PLACEHOLDER (Empty - Aap baad mein apna logo laga dena) ===== */
        .logo-placeholder {
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, #1a0a2e 0%, #4a1a6b 50%, #1a0a2e 100%);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .logo-placeholder::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
        }

        .logo-text {
            color: #d4af37;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 1;
            font-family: 'Georgia', serif;
        }

        .logo-sub {
            color: #d4af37;
            font-size: 12px;
            margin-top: 4px;
            z-index: 1;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
            z-index: 1;
        }

        /* ===== INPUT FIELDS ===== */
        .input-group {
            width: 100%;
            margin-bottom: 18px;
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 16px 16px 16px 52px;
            border: 1.5px solid #e8e8e8;
            border-radius: 50px;
            background: #fff;
            font-size: 16px;
            color: #333;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field::placeholder {
            color: #bbb;
        }

        .input-field:focus {
            border-color: #0d9e56;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #333;
            font-size: 20px;
            display: flex;
            align-items: center;
        }

        /* ===== ROW: Register & Remember Me ===== */
        .row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .link {
            color: #0d9e56;
            text-decoration: underline;
            font-size: 15px;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0d9e56;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 13px;
            flex-shrink: 0;
        }

        .checkbox-text {
            color: #0d9e56;
            font-size: 15px;
        }

        /* ===== Agree Privacy ===== */
        .agree-row {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        /* ===== Sign In Button ===== */
        .btn-signin {
            width: 100%;
            padding: 16px;
            background: #0d9e56;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 30px;
            box-shadow: 0 4px 12px rgba(13, 158, 86, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .btn-signin:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(13, 158, 86, 0.3);
        }

        /* ===== Forget Password ===== */
        .forgot-wrapper {
            text-align: center;
        }

        /* ===== OTP POPUP MODAL ===== */
        .otp-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            overflow: hidden;
        }

        .otp-overlay.show {
            display: flex;
        }

        .otp-wrap {
            width: 100%;
            max-width: 460px;
            position: relative;
            transform: scale(0.8);
            animation: popIn 0.25s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.72); opacity: 0; }
            to { transform: scale(0.8); opacity: 1; }
        }

        .otp-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 26px 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            position: relative;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 800;
            color: #1f1f1f;
            line-height: 1.2;
        }

        .close-btn {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            background: #eef7f0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: #dcefe0;
        }

        .close-btn svg {
            width: 18px;
            height: 18px;
            stroke: #333;
            stroke-width: 2.5;
        }

        .otp-desc {
            color: #1f7a4d;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .sent-to {
            color: #1f7a4d;
            font-size: 15px;
            margin-bottom: 18px;
            word-break: break-all;
        }

        .sent-to b {
            font-weight: 700;
        }

        .otp-row {
            display: flex;
            align-items: center;
            border: 1.5px solid #e3e3e3;
            border-radius: 40px;
            padding: 6px 6px 6px 16px;
            margin-bottom: 22px;
        }

        .otp-row .envelope {
            width: 24px;
            height: 24px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .otp-row .envelope svg {
            width: 100%;
            height: 100%;
            stroke: #333;
            stroke-width: 1.8;
            fill: none;
        }

        .otp-row input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 20px;
            color: #333;
            background: transparent;
            min-width: 0;
        }

        .otp-row input::placeholder {
            color: #bdbdbd;
        }

        .send-btn {
            background: #1f8a4c;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 13px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s ease;
            font-family: inherit;
        }

        .send-btn:hover {
            background: #196f3d;
        }

        .confirm-btn {
            width: 100%;
            background: #1f8a4c;
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 15px;
            font-size: 19px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s ease;
            font-family: inherit;
        }

        .confirm-btn:hover {
            background: #196f3d;
        }

        @media (max-width: 360px) {
            .otp-overlay { padding: 16px 14px; }
            .otp-card { padding: 24px 20px 22px; }
            .card-title { font-size: 22px; }
            .otp-row input { font-size: 18px; }
            .send-btn { padding: 12px 20px; font-size: 14px; }
            .confirm-btn { font-size: 17px; padding: 14px; }
        }

        /* ===== LOADING POPUP ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-popup {
            background: rgba(55, 55, 55, 0.9);
            border-radius: 13px;
            padding: 38px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== LOGO IMAGE ===== -->
        <div class="logo-placeholder">
            <img src="IMAGE/PROJECT LOGO images.jpg" alt="WynnPay Logo" class="logo-img">
        </div>

        <!-- ===== Phone Input ===== -->
        <div class="input-group">
            <span class="input-icon">
                <!-- User Icon (Exact same style) -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </span>
            <input type="tel" class="input-field" id="phone" placeholder="Phone" maxlength="10">
        </div>

        <!-- ===== Password Input ===== -->
        <div class="input-group">
            <span class="input-icon">
                <!-- Lock Icon (Exact same style) -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    <circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"></circle>
                </svg>
            </span>
            <input type="password" class="input-field" id="password" placeholder="Password">
        </div>

        <!-- ===== Register | Remember Me ===== -->
        <div class="row">
            <button class="link" onclick="handleRegister()">Register</button>
            <div class="checkbox-wrapper" onclick="toggleRemember()">
                <div class="checkbox" id="rememberCheck">✓</div>
                <span class="checkbox-text">Remember Me</span>
            </div>
        </div>

        <!-- ===== Agree Privacy ===== -->
        <div class="agree-row">
            <div class="checkbox">✓</div>
            <span class="checkbox-text">
                Agree"<button class="link" onclick="showPrivacy()">User Privacy Agreement</button>"
            </span>
        </div>

        <!-- ===== Sign In Button ===== -->
        <button class="btn-signin" onclick="handleSignIn()">Sign In</button>

        <!-- ===== Forget Password ===== -->
        <div class="forgot-wrapper">
            <button class="link" onclick="handleForgot()">Forget Password</button>
        </div>
    </div>

    <!-- ===== OTP POPUP MODAL ===== -->
    <div class="otp-overlay" id="otpOverlay">
        <div class="otp-wrap">
            <div class="otp-card">
                <div class="card-header">
                    <div class="card-title">New Device<br>Verification</div>
                    <button class="close-btn" onclick="closePopup()">
                        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <p class="otp-desc">Tap Send to receive the OTP, then enter it to confirm this login.</p>

                <p class="sent-to">OTP will be sent to <b id="otpPhone">+91 ----------</b></p>

                <div class="otp-row">
                    <div class="envelope">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 6h18v12H3z" stroke-linejoin="round"></path>
                            <path d="M3 6l9 7 9-7" stroke-linejoin="round"></path>
                        </svg>
                    </div>
                    <input type="text" id="otpInput" placeholder="OTP Code" inputmode="numeric" maxlength="6">
                    <button class="send-btn" onclick="sendOtp()">Send</button>
                </div>

                <button class="confirm-btn" onclick="confirmOtp()">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ===== LOADING POPUP ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-popup">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading</div>
        </div>
    </div>

    <script>
        // ===== JavaScript Functions =====

        function handleSignIn() {
            showLoading();
            setTimeout(function () {
                hideLoading();
                proceedSignIn();
            }, 1000);
        }

        function proceedSignIn() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            if (!phone || !password) {
                alert('Please enter Phone and Password');
                return;
            }

            if (phone.replace(/\D/g, '').length !== 10) {
                alert('Please enter a valid 10-digit mobile number');
                return;
            }

            openOtpPopup(phone);
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        // ===== OTP POPUP =====
        let generatedOtp = '';

        function openOtpPopup(phone) {
            document.getElementById('otpPhone').textContent = '+91 ' + phone;
            document.getElementById('otpInput').value = '';
            document.getElementById('otpOverlay').classList.add('show');
        }

        function closePopup() {
            document.getElementById('otpOverlay').classList.remove('show');
        }

        function sendOtp() {
            generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
            alert('OTP sent to your mobile. Demo OTP: ' + generatedOtp);
        }

        function confirmOtp() {
            const val = document.getElementById('otpInput').value.trim();
            if (!val) {
                alert('Please enter the OTP code.');
                return;
            }
            if (!generatedOtp) {
                alert('Please tap Send first to receive the OTP.');
                return;
            }
            if (val !== generatedOtp) {
                alert('Invalid OTP. Please try again.');
                return;
            }
            alert('Login successful! Welcome to WYNN PAY.');
            closePopup();
        }

        function handleRegister() {
            console.log('Navigate to Register page');
            // window.location.href = '/register';
        }

        function handleForgot() {
            console.log('Navigate to Forgot Password page');
            // window.location.href = '/forgot-password';
        }

        function showPrivacy() {
            console.log('Show Privacy Agreement');
            // window.location.href = '/privacy';
        }

        function toggleRemember() {
            const check = document.getElementById('rememberCheck');
            if (check.style.background === 'rgb(204, 204, 204)') {
                check.style.background = '#0d9e56';
            } else {
                check.style.background = '#ccc';
            }
        }

        // ===== Only Digits Allowed =====
        document.getElementById('phone').addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '');
        });

        document.getElementById('otpInput').addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '');
        });
    </script>

</body>
</html>
